# tikontrol as a custom RouterOS App (RouterOS 7.22+ with the container package).
# Same shape as MikroTik's built-in catalogue entries (see `/app/get [find name=goaway] yaml`).
#
# Install (needs external storage for the app disk):
#   /app/settings/set disk=usb1
#   /file/add name=tikontrol-app.yaml contents=...   (or upload this file)
#   /app/add yaml=[/file/get tikontrol-app.yaml contents] network=bridge auto-update=yes
#   /app/enable tikontrol
# WebFig then lists it under App with a link (show-in-webfig=yes). With network=bridge the container sits on
# the LAN bridge, so the router's api-ssl `available-from` LAN range already covers it.
# The image is published by .github/workflows/image.yml for arm/v7, arm64 and amd64.
name: tikontrol
descr: 'Unofficial personal project, not by MikroTik: read-only-by-default web UI for this router'
page: 'https://github.com/MatejMa2ur/tikontrol'
category: networking
'default-credentials': 'setup token: see the container log'
services:
  tikontrol:
    image: 'ghcr.io/matejma2ur/tikontrol:latest'
    environment:
      - 'TIK_DATA=/data'
      - 'TIK_LISTEN=0.0.0.0:8443'
    ports:
      - '8443:8443:web'
    restart: 'unless-stopped'
    volumes:
      - 'data:/data'
'supported-archs':
  - arm
  - 'arm64'
  - 'x86'
