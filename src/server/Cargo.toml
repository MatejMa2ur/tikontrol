[package]
name = "tikontrol"
version = "0.1.0"
edition = "2021"
description = "Small, read-only-by-default web UI and MCP server for MikroTik RouterOS"
license = "UNLICENSED"
publish = false

[dependencies]
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

