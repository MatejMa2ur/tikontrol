openapi: 3.1.0
info:
  title: tikontrol API
  version: 1.0.0
  description: |
    The browser API of the tikontrol server (src/server). Version 1 lives under /api/v1.
    Authentication is a session cookie (`tik_s`, HttpOnly, SameSite=Strict, Secure over HTTPS).
    Every request that is not GET must be same-origin (Origin / Sec-Fetch-Site) and, once signed in,
    carry the session's CSRF token in `X-CSRF-Token`. Everything is denied unless listed as public.
    Bodies are JSON (`Content-Type: application/json`, at most 256 KiB); unknown fields are rejected.
    Errors are `{ "error": "message" }`.
servers:
  - url: https://tikontrol.lan:8443
components:
  securitySchemes:
    session: { type: apiKey, in: cookie, name: tik_s }
    csrf: { type: apiKey, in: header, name: X-CSRF-Token }
    apiKey: { type: http, scheme: bearer, description: 'Local API key (tikapi_…): read-only viewer access to GET routes; any other method is refused' }
  schemas:
    Error: { type: object, properties: { error: { type: string } }, required: [error] }
    Ok: { type: object, properties: { ok: { type: boolean } } }
    Me:
      type: object
      properties:
        user: { type: string }
        role: { enum: [admin, viewer] }
        csrf: { type: string }
        router: { type: [object, 'null'], properties: { host: { type: string }, mode: { enum: [read-only, read-write] } } }
        readOnly: { type: boolean }
        policies: { type: [object, 'null'], properties: { user: { type: string }, group: { type: string }, policy: { type: array, items: { type: string } } } }
        error: { type: [string, 'null'] }
    Cred: { type: object, required: [user, password], properties: { user: { type: string, maxLength: 64 }, password: { type: string, maxLength: 256 } } }
    Intent:
      type: object
      required: [kind]
      description: A Safe apply intent. `kind` selects the change; see src/server/src/apply.rs and src/server/src/intents/.
      properties: { kind: { type: string, examples: [block-client, dns-record, port-forward, traffic-rule, set-port-mirror, create-bond] } }
      additionalProperties: true
    Preview:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        risk: { enum: [low, medium, high] }
        warnings: { type: array, items: { type: string } }
        commands: { type: array, items: { type: string } }
        undo: { type: array, items: { type: string } }
        revertible: { type: boolean }
        window: { type: integer, description: seconds before the router reverts by itself }
        canApply: { type: boolean }
        reason: { type: [string, 'null'] }
security: [{ session: [] }]
paths:
  /api/v1/health:
    get:
      security: []
      summary: Liveness and whether first-run setup is needed (public)
      responses: { '200': { description: ok, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean }, version: { type: string }, needsSetup: { type: boolean }, routerHint: { type: string, nullable: true, description: 'only while setup is needed: TIK_ROUTER or the default gateway' } } } } } } }
  /api/v1/ca.crt:
    get:
      security: []
      summary: "tikontrol's local CA certificate (PEM, public; never the key), to install on devices so they trust tikontrol's HTTPS. 404 when TIK_TLS_CERT/KEY are used"
      responses: { '200': { description: 'attachment tikontrol-ca.crt', content: { application/x-x509-ca-cert: { schema: { type: string } } } }, '404': { description: no local CA } }
  /api/v1/setup/admin:
    post:
      security: []
      summary: Create the first admin with the one-time setup token from the log (public, once)
      requestBody: { content: { application/json: { schema: { type: object, required: [token, name, password], properties: { token: { type: string }, name: { type: string, maxLength: 32 }, password: { type: string, minLength: 12, maxLength: 256 } } } } } }
      responses: { '200': { description: signed in }, '403': { description: wrong token }, '409': { description: already set up }, '429': { description: rate limited } }
  /api/v1/setup/start:
    post:
      security: []
      summary: 'First run: trade the setup token from the log for a temporary admin session (user "(setup)") that connects the router. Ends, with the token, when the first admin signs in. Rate limited'
      requestBody: { content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { '200': { description: sets the session cookie; body has user, role, csrf }, '403': { description: wrong or used token }, '429': { description: rate limited } }
  /api/v1/setup/probe:
    post:
      security: []
      summary: 'One-step setup, while unclaimed and no router is connected: read the router certificate fingerprint. With a router hint only that host is accepted. Failures count toward the login rate limit'
      requestBody: { content: { application/json: { schema: { type: object, required: [host], properties: { host: { type: string }, port: { type: integer, default: 8729 } } } } } }
      responses: { '200': { description: '{ pin }' }, '403': { description: not the router tikontrol found }, '409': { description: setup already done }, '429': { description: rate limited }, '502': { description: '{ error, commands }: API-SSL unreachable; commands give it a certificate' } }
  /api/v1/setup/router:
    post:
      security: []
      summary: 'One-step setup: a full MikroTik admin (read, write, policy, api, test) proves ownership instead of the setup token. Pins the certificate, creates or resets the tikontrol-read group (read,api,test) and user (random password, address = tikontrol /32), all commented "tik: tikontrol", stores the reader encrypted, read-only mode, claims tikontrol and signs the admin in (MikroTik session). Only while unclaimed; rate limited like login'
      requestBody: { content: { application/json: { schema: { type: object, required: [host, pin, user, password], properties: { host: { type: string }, port: { type: integer, default: 8729 }, pin: { type: string, description: 64 hex characters from /setup/probe }, user: { type: string }, password: { type: string }, remember: { type: boolean, default: true } } } } } }
      responses: { '200': { description: 'sets the session cookie; body has user, role, csrf, mikrotik: true' }, '401': { description: router rejected the login }, '403': { description: not a full admin (nothing written), or not the router tikontrol found }, '409': { description: setup already done }, '429': { description: rate limited }, '502': { description: router unreachable or refused a command } }
  /api/v1/login:
    post:
      security: []
      summary: 'Sign in with a local tikontrol account or, when no local account has that name, a MikroTik account checked live against the router (write policy → admin, otherwise viewer). Public, rate limited per IP and globally'
      requestBody: { content: { application/json: { schema: { type: object, required: [name, password], properties: { name: { type: string }, password: { type: string }, remember: { type: boolean, description: "Keep this browser signed in for 30 days (separate tik_r cookie, survives restarts; logout ends it)" } } } } } }
      responses: { '200': { description: 'sets the session cookie; body has user, role, csrf and mikrotik: true for a MikroTik-account session' }, '401': { description: wrong credentials }, '429': { description: rate limited } }
  /api/v1/logout:
    post: { security: [{ session: [], csrf: [] }], summary: End the session, responses: { '200': { description: ok } } }
  /api/v1/me:
    get: { summary: Current user, mode and detected router policies, responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } } } }
  /api/v1/snapshot:
    get:
      summary: Latest router snapshot (same shape as src/scripts/snapshot.py; secrets never requested)
      responses: { '200': { description: snapshot; header x-snapshot-age in seconds }, '503': { description: not read yet, or read-only mode refused } }
  /api/v1/live:
    get: { summary: 'Server-Sent Events: { t, rx, tx, cpu, mem (%), temp (°C or null when the board has no sensor), wanUp, rate: { mac: { rx, tx } } } every 2 s', responses: { '200': { description: text/event-stream } } }
  /api/v1/history:
    get:
      summary: Internet Activity series
      parameters: [{ name: range, in: query, schema: { enum: ['1H', '1D', '1W'] } }]
      responses: { '200': { description: '{ t[], clients[], rx[], tx[], cpu[] (%), mem[] (%), temp[] (°C, null without a sensor), peak: { rx, tx } (highest minute average in the range, bit/s), peakAll: { rx, tx } (all stored history) }' } }
  /api/v1/speedtest:
    get:
      summary: Speed test endpoint and the last 50 results (oldest first; down/up in bit/s, ping in ms); wait = seconds until the next run is allowed
      responses: { '200': { description: '{ url, default, results[{ t, down, up, ping, host }], running, wait, minGap }' } }
    put:
      security: [{ session: [], csrf: [] }]
      summary: Set the endpoint (admin). HTTPS only, no query; null restores the default (https://speed.cloudflare.com)
      requestBody: { content: { application/json: { schema: { type: object, properties: { url: { type: string, nullable: true } } } } } }
      responses: { '200': { description: ok }, '400': { description: invalid URL }, '403': { description: not admin } }
    post:
      security: [{ session: [], csrf: [] }]
      summary: Run a speed test now (admin, opt-in; contacts the endpoint, Cloudflare by default). Measures tikontrol's host connection. One at a time, at most one per 3 minutes; about 25 MB down, 10 MB up, 10 s per direction
      responses: { '200': { description: the new result }, '403': { description: not admin }, '429': { description: too soon or already running (retry-after) }, '502': { description: the endpoint failed } }
  /api/v1/discovery:
    get:
      summary: What LAN devices said about themselves over mDNS/DNS-SD and SSDP/UPnP (newest first, max 512). Values are untrusted device text (control characters stripped, 40 keys/device, 256 chars/value); wait = seconds until the next run is allowed
      responses: { '200': { description: '{ auto, running, last, wait, minGap, devices[{ ip, mac (from ARP/leases, may be null), t, kv[[source (mdns|ssdp), key, value]] }] }' } }
    put:
      security: [{ session: [], csrf: [] }]
      summary: 'Turn the 10-minute schedule on or off (admin). Off by default: "Ask devices on the LAN for details (mDNS/SSDP, stays on your network)"'
      requestBody: { content: { application/json: { schema: { type: object, required: [auto], properties: { auto: { type: boolean } }, additionalProperties: false } } } }
      responses: { '200': { description: ok }, '400': { description: invalid body }, '403': { description: not admin } }
  /api/v1/discovery/run:
    post:
      security: [{ session: [], csrf: [] }]
      summary: Ask the LAN now (admin, at most once a minute). Multicast to 224.0.0.251:5353 and 239.255.255.250:1900 for 2.5 s, answers only from private/link-local IPv4; UPnP descriptions are fetched only from the responder's own private address (http, no redirects, 64 KB, 2 s). Nothing leaves the LAN
      responses: { '200': { description: '{ found: number of devices that answered }' }, '403': { description: not admin }, '429': { description: too soon or already running (retry-after) } }
  /api/v1/health/internet:
    get: { summary: 'Last 12 h in 48 slots: ok | warn | bad | none', responses: { '200': { description: ok } } }
  /api/v1/history/client:
    get:
      summary: Hourly bytes, first/last seen and events of one client
      parameters: [{ name: mac, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: ok } }
  /api/v1/flows:
    get:
      summary: NetFlow v5 aggregates (collector is opt-in via TIK_FLOWS; in memory only). Destinations are named from the router's DNS cache; countries need TIK_GEOIP (a local CSV, never downloaded)
      responses: { '200': { description: '{ since, flows, talkers[{ ip, down, up, destinations[{ ip, bytes, name }] }], destinations[{ ip, bytes, name }], ports[{ proto, port, service, bytes }], geoip, countries[{ country (ISO code, ?? = unknown), bytes }] }' } }
  /api/v1/clients/offline:
    get: { summary: Clients seen before but not in the last 2 minutes, responses: { '200': { description: ok } } }
  /api/v1/events:
    get:
      summary: Derived events (newest first, max 500); format=csv exports with formula cells neutralised
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: cat, in: query, schema: { type: string } }
        - { name: format, in: query, schema: { enum: [json, csv] } }
      responses: { '200': { description: ok } }
  /api/v1/apikeys:
    get: { summary: 'API keys (admin): [{ name, created }]; keys themselves are never returned again', responses: { '200': { description: ok }, '403': { description: not admin } } }
    post:
      security: [{ session: [], csrf: [] }]
      summary: Create a read-only API key (admin, max 20). The key is returned once; only its SHA-256 is stored
      requestBody: { content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }
      responses: { '200': { description: '{ name, key }' }, '400': { description: invalid name }, '409': { description: duplicate or too many } }
    delete:
      security: [{ session: [], csrf: [] }]
      summary: Revoke an API key (admin)
      parameters: [{ name: name, in: query, required: true, schema: { type: string } }]
      responses: { '200': { description: ok }, '404': { description: no such key } }
  /api/v1/tools/console:
    get: { summary: Commands the read-only console accepts, responses: { '200': { description: 'string[]' } } }
    post:
      security: [{ session: [], csrf: [] }]
      summary: 'Run one read command as the reader: a print of a menu the snapshot reads (with its fixed proplist) or `/interface/monitor-traffic <name> once`. Rate limited with the other tools'
      requestBody: { content: { application/json: { schema: { type: object, required: [command], properties: { command: { type: string } } } } } }
      responses: { '200': { description: '{ tool, command, rows[], note }' }, '400': { description: not on the read-only list }, '429': { description: too soon } }
  /api/v1/retention:
    get: { summary: "Days of tikontrol's own history kept (traffic, events, per-client usage)", responses: { '200': { description: '{ days, max }' } } }
    put:
      security: [{ session: [], csrf: [] }]
      summary: Set retention in days (admin, 1-max); older history is deleted right away
      requestBody: { content: { application/json: { schema: { type: object, required: [days], properties: { days: { type: integer } } } } } }
      responses: { '200': { description: ok }, '400': { description: out of range }, '403': { description: not admin } }
  /api/v1/prefs:
    get: { summary: Shared names, icons, notes, groups and hidden clients, responses: { '200': { description: ok } } }
    put: { security: [{ session: [], csrf: [] }], summary: Replace prefs (size-capped), responses: { '200': { description: ok }, '413': { description: too large } } }
  /api/v1/router:
    get: { summary: Router connection (no passwords) and detected policies, responses: { '200': { description: ok } } }
    post:
      security: [{ session: [], csrf: [] }]
      summary: Connect a router (admin). Logs in, checks real group policies, refuses an over-privileged reader
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [host, pin, reader]
              properties:
                host: { type: string }
                port: { type: integer, default: 8729, not: { const: 8728 } }
                pin: { type: string, pattern: '^[0-9a-f]{64}$' }
                mode: { enum: [read-only, read-write], default: read-only }
                reader: { $ref: '#/components/schemas/Cred' }
                writer: { oneOf: [{ $ref: '#/components/schemas/Cred' }, { type: 'null' }] }
                confirm_write: { type: boolean }
      responses: { '200': { description: saved }, '400': { description: invalid or over-privileged }, '409': { description: read-write needs confirm_write }, '502': { description: router refused } }
    delete: { security: [{ session: [], csrf: [] }], summary: Forget the router (admin), responses: { '200': { description: ok } } }
  /api/v1/router/probe:
    post: { security: [{ session: [], csrf: [] }], summary: Read the API-SSL certificate fingerprint (admin; sends no credentials), responses: { '200': { description: '{ pin }' } } }
  /api/v1/router/setup-commands:
    get:
      summary: RouterOS commands that create least-privilege tikontrol users (no secrets)
      parameters: [{ name: ip, in: query, schema: { type: string } }, { name: write, in: query, schema: { enum: ['0', '1'] } }]
      responses: { '200': { description: '{ commands[] }' } }
  /api/v1/apply:
    get: { summary: Recent applied changes and their state, responses: { '200': { description: ok } } }
  /api/v1/apply/preview:
    post:
      security: [{ session: [], csrf: [] }]
      summary: Compile an intent to RouterOS commands and their inverse (works in read-only mode)
      requestBody: { content: { application/json: { schema: { type: object, required: [intent], properties: { intent: { $ref: '#/components/schemas/Intent' } } } } } }
      responses: { '200': { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Preview' } } } }, '400': { description: invalid intent } }
  /api/v1/apply/start:
    post: { security: [{ session: [], csrf: [] }], summary: 'Arm the router-side revert, then apply (admin, read-write)', responses: { '200': { description: armed }, '403': { description: read-only or not admin }, '502': { description: failed and undone } } }
  /api/v1/apply/keep:
    post: { security: [{ session: [], csrf: [] }], summary: Confirm within the window; removes the revert job, responses: { '200': { description: ok }, '409': { description: too late or not armed } } }
  /api/v1/apply/revert:
    post: { security: [{ session: [], csrf: [] }], summary: Undo now and remove the revert job, responses: { '200': { description: ok } } }
  /mcp:
    post:
      security: []
      summary: MCP endpoint (JSON-RPC 2.0, Streamable HTTP). Off by default; bearer token; local network only. See docs/DEPLOY.md
      responses: { '200': { description: JSON-RPC response }, '401': { description: bad token }, '404': { description: disabled } }
