# Publishes the container image to ghcr.io/<owner>/tikontrol on every push to master: :latest and :<sha>.
# RouterOS containers with remote-image=ghcr.io/<owner>/tikontrol:latest pick it up on repull.
# Cross-compiles in the build stage (see Containerfile), so no QEMU. Plain docker CLI: no third-party actions.
name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          img="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/tikontrol"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --name tik --driver docker-container --use
          docker buildx build --platform linux/arm/v7,linux/arm64,linux/amd64 -f Containerfile \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            --cache-from "type=registry,ref=$img:buildcache" --cache-to "type=registry,ref=$img:buildcache,mode=max" \
            -t "$img:latest" -t "$img:${SHA::12}" --push .
      # Keep the newest 10 builds. Each build is one tagged multi-arch index plus untagged per-arch manifests,
      # so only delete untagged versions no kept index still points to.
      - name: Prune old versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          kind=$(gh api "/users/$OWNER" --jq '.type | ascii_downcase')s
          base="/$kind/$OWNER/packages/container/tikontrol/versions"
          gh api --paginate "$base?per_page=100" > versions.json
          jq -s 'add | map(select((.metadata.container.tags | length > 0) and (.metadata.container.tags | index("buildcache") | not))) | sort_by(.created_at) | reverse' versions.json > tagged.json
          keep=$(jq -r '.[:10][] | .name' tagged.json)
          refs=$(for d in $keep; do docker buildx imagetools inspect --raw "ghcr.io/$owner/tikontrol@$d" | jq -r '.manifests[]?.digest'; done)
          jq -r '.[10:][] | .id' tagged.json > drop.txt
          jq -rs 'add | map(select(.metadata.container.tags | length == 0)) | .[] | "\(.id) \(.name)"' versions.json |
            while read -r id name; do echo "$refs" | grep -qx "$name" || echo "$id"; done >> drop.txt
          while read -r id; do gh api -X DELETE "$base/$id" && echo "deleted $id"; done < drop.txt
