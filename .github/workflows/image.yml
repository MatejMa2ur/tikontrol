# Publishes the container image to ghcr.io/<owner>/tikontrol on every push to master: :latest and :<sha>.
# RouterOS containers with remote-image=ghcr.io/<owner>/tikontrol:latest pick it up on repull.
# Cross-compiles in the build stage (see Containerfile), so no QEMU. Plain docker CLI: no third-party actions.
name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and push
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          img="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/tikontrol"
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker buildx create --name tik --driver docker-container --use
          docker buildx build --platform linux/arm/v7,linux/arm64,linux/amd64 -f Containerfile \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -t "$img:latest" -t "$img:${SHA::12}" --push .
