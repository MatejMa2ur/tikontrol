# Checks every push and pull request: UI types and build, the node tests, Rust tests and clippy, and audits.
# Actions are pinned by commit SHA (Dependabot keeps them current). No secrets are used here.
name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ui/package-lock.json
      - name: Install
        working-directory: src/ui
        run: npm ci --ignore-scripts
      - name: Type check
        working-directory: src/ui
        run: npm run check
      - name: Node tests
        run: node --test tests/*.test.ts
      - name: Build
        working-directory: src/ui
        run: npm run build
      - name: Audit
        working-directory: src/ui
        run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-dist
          path: src/ui/dist
          retention-days: 3

  server:
    needs: ui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ui-dist
          path: src/ui/dist
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src/server
      - name: Tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Third-party licenses up to date
        run: |
          (cd ../ui && npm ci --ignore-scripts)
          python3 ../scripts/third_party.py | diff -q - ../../THIRD_PARTY_LICENSES.txt \
            || { echo "::error::THIRD_PARTY_LICENSES.txt is stale: run python3 src/scripts/third_party.py > THIRD_PARTY_LICENSES.txt"; exit 1; }
      - name: Audit (RustSec)
        run: |
          cargo install --locked cargo-audit
          cargo audit --deny warnings
